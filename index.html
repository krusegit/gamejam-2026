    <!-- Staging/production manifest detection -->
    <script>
      (function() {
        try {
          // BranchStaging is canonical; BranchMain remains as a compatibility alias.
          window.isStagingBuild = /\/(?:BranchStaging|BranchMain)(?:\/|$)/.test(window.location.pathname);
          if (window.isStagingBuild) {
            // Switch to staging manifest
            var manifestLink = document.getElementById('manifest-link');
            if (manifestLink) manifestLink.href = 'manifest-staging.json';
            
            // Fetch the production manifest to get the base name, then append " Staging"
            fetch('manifest.json')
              .then(function(r) { return r.json(); })
              .then(function(manifest) {
                var baseName = manifest.name || 'Web Game';
                var stagingName = baseName + ' Staging';
                document.title = stagingName;
                var appNameMeta = document.getElementById('app-name-meta');
                if (appNameMeta) appNameMeta.content = stagingName;
              })
              .catch(function() {
                // Fallback if fetch fails
                document.title = document.title + ' Staging';
              });
          }
        } catch (e) {
          // Staging detection failed - continue with defaults
          window.isStagingBuild = false;
        }
      })();
    </script>

      html, body {

      /* iOS Safari fullscreen fix */
      @supports (-webkit-touch-callout: none) {
        html, body {
          /* Use viewport units that account for iOS Safari's dynamic toolbar */
          height: 100%;
          min-height: 100vh;
          min-height: -webkit-fill-available;
          min-height: 100dvh;
        }
        #unity-canvas {
          height: 100%;
          min-height: 100vh;
          min-height: -webkit-fill-available;
          min-height: 100dvh;
        }
      }
      
      /* PWA Standalone mode - truly fullscreen */

        left: 0;
        width: 100%;
        height: 100%;

        display: flex;
        flex-direction: column;
        align-items: center;

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #a0a0a0;
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
      }
      
      .loading-progress {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 15px;
        overflow: hidden;
      }

        width: 0%;
        height: 100%;
        background: #ffffff;
        border-radius: 2px;
        transition: width 0.3s ease;
      }

        border: 1px solid rgba(255, 107, 107, 0.55);
        border-radius: 12px;

      }

        flex-direction: column;
        align-items: center;
        justify-content: flex-start;

        pointer-events: auto;

        display: flex;

              tryLockLandscape();
            }).catch(function() {});
          } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
            // Try to lock orientation after entering fullscreen
            setTimeout(tryLockLandscape, 100);
          }
        }
        
        // Request fullscreen on first touch (if not in PWA mode)
        canvas.addEventListener('touchstart', function() {
          // Small delay to ensure PWA prompt has been handled
          setTimeout(tryFullscreen, 100);
        }, { once: true });
      }
      
      // Handle orientation change events
      if (screen.orientation) {
        screen.orientation.addEventListener('change', function() {
          setTimeout(updateCanvasSize, 100);
        });
      }
      
      // Also listen for window orientation change (iOS)
      window.addEventListener('orientationchange', function() {
        setTimeout(updateCanvasSize, 100);
        setTimeout(updateCanvasSize, 300);
        setTimeout(updateCanvasSize, 500);
      });

      // Register Service Worker for PWA (all errors silently ignored - game must load)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
              .then(function(registration) {
                try {
                  registration.update();
                  registration.addEventListener('updatefound', function() {
                    var newWorker = registration.installing;
                    if (newWorker) {
                      newWorker.addEventListener('statechange', function() {});
                    }
                  });
                } catch (e) { /* ignore */ }
              })
              .catch(function() { /* Service worker registration failed - continue anyway */ });
          } catch (e) { /* ignore */ }
        });
        
        try {
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'NEW_VERSION_AVAILABLE') {
              // VersionChecker owns the pre-start update flow. Never interrupt a
              // WASM instance that is already starting or running.
              if (unityStartupState !== 'idle') {
                console.log('[ServiceWorker] Update deferred until the next page load');
                return;
              }
              var loadingText = document.querySelector('.loading-text');
              if (loadingText) {
                loadingText.textContent = 'New version found! Updating...';
              }
              setTimeout(function() {
                window.location.reload(true);
              }, 500);
            }
          });

          // A service-worker handoff may occur while Unity is compiling WASM.
          // Reloading here tears down a partially-created player and can leave
          // a black canvas or a second createUnityInstance call.
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            console.log('[ServiceWorker] Controller changed; using it on the next navigation');
          });
        } catch (e) { /* ignore */ }
      }

      // Function to start the Unity game
      function startUnityGame() {
        if (unityStartupState !== 'idle') {
          console.warn('[Unity] Ignoring duplicate startup request in state:', unityStartupState);
          return;
        }

        setUnityStartupState('starting');
        var graphicsSupport = checkGraphicsSupport();
        if (!graphicsSupport.ok) {
          setUnityStartupState('failed');
          showHardwareAccelerationError(graphicsSupport.reason);
          return;
        }

        createUnityInstance(document.querySelector("#unity-canvas"), {
          dataUrl: "Build/b740de02e31af9ec1d9139c3ef80beb7.data.unityweb",
          frameworkUrl: "Build/a2788494b70215417a21a86d1bbabfd0.framework.js.unityweb",
          codeUrl: "Build/953a8319d8c92c5f2c1b5604581183be.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "BudgetGameDev",
          productName: "Galdrava",
          productVersion: "0.0.1",
          // Unity synchronizes its drawing buffer to the CSS size and selected DPR.
          // Apple mobile uses a capped 2x Retina buffer so text and world rendering
          // stay sharp without the 9x pixel cost of a full 3x iPhone framebuffer.
          // Desktop browsers retain their native DPR.
          matchWebGLToCanvasSize: true,
          autoSyncPersistentDataPath: true,
          devicePixelRatio: unityDevicePixelRatio,
          // Progress callback
          onProgress: function(progress) {
            if (progressBar) {
              progressBar.style.width = (progress * 100) + '%';
            }
          }
        }).then(function(unityInstance) {
          window.unityInstance = unityInstance;
          setUnityStartupState('started');
          
          // Signal that game has started (prevents service worker reload interrupts)
          window.dispatchEvent(new Event('unity-game-started'));
          
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
          
          updateCanvasSize();
          
          // Warm up Android/mobile caches after startup. Do not immediately re-fetch
          // the ~100 MB Unity payload on iOS Safari while the game is using its
          // tighter memory budget; controlled loads are already cached by the worker.
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller && isMobile && !isiOSDevice) {
              setTimeout(function() {
                try {
                  // Get the current page's build file URLs from the loader
                  var buildFiles = [
                    'Build/b740de02e31af9ec1d9139c3ef80beb7.data.unityweb',
                    'Build/a2788494b70215417a21a86d1bbabfd0.framework.js.unityweb',
                    'Build/953a8319d8c92c5f2c1b5604581183be.wasm.unityweb',
                    './index.html',
                    './manifest.json',
                    './platform-detection.js',
                    './version-check.js',
                    './lucide-icons.js',
                    './pwa-install.js',
                    './pwa-install.css'
                  ];
                  
                  // Convert relative URLs to absolute
                  var baseUrl = window.location.href.split('?')[0].replace(/\/[^\/]*$/, '/');
                  var absoluteUrls = buildFiles.map(function(url) {
                    return new URL(url, baseUrl).href;
                  });
                  
                  console.log('[CacheWarmup] Requesting cache warmup for', absoluteUrls.length, 'files');
                  navigator.serviceWorker.controller.postMessage({
                    type: 'WARMUP_CACHE',
                    urls: absoluteUrls
                  });
                } catch (e) {
                  console.warn('[CacheWarmup] Error:', e);
                }
              }, 3000); // Wait 3 seconds after game loads
            }
          } catch (e) { /* ignore */ };
        }).catch(function(error) {
          setUnityStartupState('failed');
          console.warn('[Unity] createUnityInstance failed:', error);

          // A partially-created Unity/WASM runtime cannot safely be reused.
          // Offer a full cache-clearing page reload instead of starting a second
          // instance in the same JavaScript context.
          if (loadingScreen) {
            var errorMessage = (error && error.message) ? error.message : 'Could not load game files.';
            var normalizedError = String(errorMessage).toLowerCase();

            if (normalizedError.includes('webgl') ||
                normalizedError.includes('graphics') ||
                normalizedError.includes('gpu') ||
                normalizedError.includes('context')) {
              showHardwareAccelerationError('The browser could not create the WebGL graphics context.');
              return;
            }
            
            // Provide helpful message based on state
            if (!navigator.onLine) {
              // Check if service worker is active (files should be cached)
              if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                errorMessage = 'Loading failed. Try closing and reopening the app.';
              } else {
                errorMessage = 'You appear to be offline. Please connect to the internet to download the game, then you can play offline.';
              }
            }
            
            showStartupError('Failed to load game', errorMessage, null, true);
          }
        });
      }
      
      // Check for updates before starting the game
      // This runs only at page load and will reload the page if an update is found
      // CRITICAL: Any errors must be ignored - game MUST try to load regardless
      try {
        if (window.VersionChecker && typeof window.VersionChecker.checkForUpdates === 'function') {
          window.VersionChecker.checkForUpdates()
            .then(function() {
              startUnityGame();
            })
            .catch(function(err) {
              console.warn('[Startup] Version check failed, starting game anyway:', err);
              startUnityGame();
            });
        } else {
          startUnityGame();
        }
      } catch (e) {
        console.warn('[Startup] Version checker error, starting game anyway:', e);
        startUnityGame();
      }
      
      // Show staging build info overlay (only on staging builds)
      try {
        if (window.isStagingBuild) {
          fetch('version.json?_=' + Date.now())
            .then(function(r) { return r.json(); })
            .then(function(version) {
              var overlay = document.getElementById('staging-build-info');
              if (overlay && version) {
                var info = version.buildId || 'unknown';
                if (version.buildTimestamp) {
                  info += ' | ' + version.buildTimestamp;
                }
                overlay.textContent = 'STAGING: ' + info;
                overlay.style.display = 'block';
              }
            })
            .catch(function() {
              var overlay = document.getElementById('staging-build-info');
              if (overlay) {
                overlay.textContent = 'STAGING BUILD';
                overlay.style.display = 'block';
              }
            });
        }
      } catch (e) { /* staging overlay failed - non-critical */ }
      
      // Global error handler - prevent uncaught errors from breaking the game
      window.addEventListener('error', function(e) {
        console.warn('[Global] Uncaught error (game continues):', e.message);
        // Don't prevent default - let errors log to console
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.warn('[Global] Unhandled promise rejection (game continues):', e.reason);
        // Prevent the rejection from being treated as an error
        e.preventDefault();
      });
    </script>
